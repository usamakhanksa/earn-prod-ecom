name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnisell
          POSTGRES_PASSWORD: omnisell
          POSTGRES_DB: omnisell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnisell -d omnisell"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          pnpm install --no-frozen-lockfile
          (cd apps/api && npx prisma generate)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate + seed
        run: pnpm --filter @omnisell/api db:deploy && pnpm --filter @omnisell/api db:seed
        env:
          DATABASE_URL: postgresql://omnisell:omnisell@localhost:5432/omnisell

      - name: API e2e (supertest against booted app)
        run: pnpm --filter @omnisell/api test:e2e

      - name: Build
        run: pnpm build

  accessibility-gate:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - run: echo 'axe scan of key routes (web EN/AR + admin) runs here against a deployed preview; blocked in this PR pipeline until the E2E playground exists.'
        # TODO(follow-up): boot web+api, run apps/api/tools/axe.mjs with E2E=1 and fail on serious/critical.